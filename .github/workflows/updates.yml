#
# Customized Upptime workflows: SHA-pinned actions.
# Scheduled Update Template / Updates CI is disabled so these pins persist.
# Re-run this workflow manually only if you intend to sync with upstream
# (that will overwrite workflow files).
#
# 🔼 Upptime @v1.43.16
# GitHub-powered open-source uptime monitor and status page by Anand Chowdhary

# * Source: https://github.com/upptime/upptime
# * Docs and more: https://upptime.js.org
# * More by Anand Chowdhary: https://anandchowdhary.com


name: Updates CI
on:
  repository_dispatch:
    types: [updates]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Deploy updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update code
        uses: upptime/updates@f644764aedcb1d19a29c7b1999fd589191519bf2 # master @ 2026-08-31
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
